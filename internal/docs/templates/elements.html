<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>{{ .Title }}</title>
    <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@stoplight/elements/styles.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      elements-api {
        display: block;
        height: 100%;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <elements-api
      apiDescriptionUrl="{{ .SpecURL }}"
      router="hash"
      layout="sidebar"
    ></elements-api>
  </body>
</html>
