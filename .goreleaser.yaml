# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: esquema

before:
  hooks:
    - go mod tidy

builds:
  - id: esquema
    main: ./cmd/esquema
    binary: esquema
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.branch={{ .Branch }}
      - -X {{ .ModulePath }}/internal/version.shortCommit={{ .ShortCommit }}
      - -X {{ .ModulePath }}/internal/version.fullCommit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/version.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md*
      - LICENSE*
      - CONTRIBUTING.md*
      - SECURITY.md*
      - man/esquema.1*

nfpms:
  - id: packages
    package_name: esquema
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/ju4n97/esquema"
    maintainer: "Juan <https://github.com/ju4n97>"
    description: "Declarative API runtime that turns HCL manifests into structured HTTP services."
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: default
    priority: optional
    contents:
      - src: ./man/esquema.1
        dst: /usr/share/man/man1/esquema.1
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

dockers_v2:
  - images:
      - ghcr.io/ju4n97/esquema
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

changelog:
  sort: asc
  use: github
  abbrev: 7
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (by @{{ . }}){{ end }}"
  filters:
    exclude:
      - '(?i)^merge\s+'
      - '(?i)^bump\s+'
      - '(?i)^dependabot'
      - '(?i)^wip'
      - '(?i)^docs(\(.*\))?:'
      - '(?i)^test(\(.*\))?:'
      - '(?i)^tests(\(.*\))?:'
      - '(?i)^ci(\(.*\))?:'
      - '(?i)^chore(\(.*\))?:'
      - '(?i)^style(\(.*\))?:'
  groups:
    - title: "⚠️ Breaking changes"
      regexp: '(?i)^(\w+)(\(.*\))?!:|^breaking[- ]change:'
      order: 0

    - title: "Features and enhancements"
      regexp: '(?i)^feat(\(.*\))?!?:'
      order: 1

    - title: "Bug fixes and stability"
      regexp: '(?i)^fix(\(.*\))?!?:'
      order: 2

    - title: "Performance improvements"
      regexp: '(?i)^perf(\(.*\))?!?:'
      order: 3

    - title: "Refactoring and maintenance"
      regexp: '(?i)^refactor(\(.*\))?!?:'
      order: 4

    - title: "Other changes"
      order: 999